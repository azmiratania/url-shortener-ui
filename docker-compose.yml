services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_DB: urlshortener
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  app:
    # Set DOCKERHUB_USERNAME in a .env file (same as the GitHub secret).
    # Optional: APP_TAG=sha-<commit> or a release tag (default: latest).
    image: azmiratania/url-shortener-ui:latest
    pull_policy: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      SHORT_URL_BASE: https://url.azmiratania.com
      REPOSITORY_TYPE: postgres
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
